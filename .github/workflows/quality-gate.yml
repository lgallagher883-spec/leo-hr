name: Leo quality gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint $(git diff --name-only --diff-filter=ACMR origin/master...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' | tr '\n' ' ')
        # Existing repository-wide lint debt is tracked separately; this gate prevents new/changed files from introducing lint errors.

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run critical regression tests
        run: npm test
      - name: Build application
        env:
          OPENAI_API_KEY: test-ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: test-ci-placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://app.leohr.co.uk
        run: npm run build
